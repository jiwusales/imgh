.gallery{grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
.card{padding:7px;border-radius:10px}

<section class="tool-login" id="toolLogin"><form id="toolLoginForm"><h1>JIWU 圖片工具</h1><p>請使用後台密碼登入</p><input id="toolPassword" type="password" autocomplete="current-password" placeholder="後台密碼" required><button>登入</button><button type="button" id="reuseAdmin">沿用這台裝置的後台登入</button><p id="toolLoginError" role="alert"></p></form></section><main><h1>已上傳圖片</h1><form id="filters" class="filters"><label>上傳日期（台灣時間）<input type="date" id="date"></label><label>檔名／貨號<input id="query" type="search" placeholder="輸入關鍵字"></label><label>圖片資料夾<select id="folder"><option value="all">全部</option><option value="images">images</option><option value="images_1350">images_1350</option></select></label><button>查詢</button><button type="button" id="today">今天</button><button type="button" id="all">全部日期</button></form><p id="notice">點擊圖片即可複製圖片網址。舊圖片日期依原始檔名中的上傳時間判定；無法確認日期的圖片可在「全部日期」查詢。</p><p id="status" role="status"></p><div id="gallery" class="gallery"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><script src="history.js?v=20261028-return" defer></script></body></html>
