<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已上傳圖片｜JIWU</title><link rel="stylesheet" href="shared.css"><script src="shared.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f6f8;color:#333;font-family:-apple-system,sans-serif}main{max-width:1100px;margin:auto;background:white;border-radius:18px;padding:24px}.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:24px 0}.filters label{display:grid;gap:8px}input,select,button{padding:12px;border:1px solid #ccd3da;border-radius:10px;font-size:16px}button{cursor:pointer;background:#53697f;color:white}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}.card{border:1px solid #e1e5e9;border-radius:12px;padding:12px;min-width:0}.card img{width:100%;height:180px;object-fit:contain;background:#f4f6f8}.card p{overflow-wrap:anywhere;font-size:13px;line-height:1.6}.card button{width:100%}.pager{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:24px}#notice{line-height:1.7;color:#667;font-size:14px}@media(max-width:600px){main{padding:18px}.filters>*{width:100%}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:135px}.card button{font-size:14px;padding:10px}}
</style></head><body><header class="tool-header"><strong>JIWU 圖片工具</strong><nav aria-label="圖片工具"><a href="./index.html">圖床／裁切</a><a href="./remove.html">去背小幫手</a><a href="./history.html">已上傳圖片</a><button type="button" id="logout">登出</button></nav></header>
<section class="tool-login" id="toolLogin"><form id="toolLoginForm"><h1>JIWU 圖片工具</h1><p>請使用後台密碼登入</p><input id="toolPassword" type="password" autocomplete="current-password" placeholder="後台密碼" required><button>登入</button><p id="toolLoginError" role="alert"></p></form></section><main><h1>已上傳圖片</h1><form id="filters" class="filters"><label>上傳日期（台灣時間）<input type="date" id="date"></label><label>檔名／貨號<input id="query" type="search" placeholder="輸入關鍵字"></label><label>圖片資料夾<select id="folder"><option value="all">全部</option><option value="images">images</option><option value="images_1350">images_1350</option></select></label><button>查詢</button><button type="button" id="today">今天</button><button type="button" id="all">全部日期</button></form><p id="notice">舊圖片日期依原始檔名中的上傳時間判定；無法確認日期的圖片可在「全部日期」查詢。</p><p id="status" role="status"></p><div id="gallery" class="gallery"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><script src="history.js" defer></script></body></html>
